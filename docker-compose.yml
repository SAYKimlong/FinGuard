services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finguard
      # Set POSTGRES_PASSWORD in the ignored project-root .env file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project-root .env file}
      POSTGRES_DB: finguard
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    # Bind to loopback: other machines cannot connect through this published port.
    ports:
      - "127.0.0.1:5555:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finguard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
